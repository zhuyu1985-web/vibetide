<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRTV · 智能对话工作台</title>
<link rel="stylesheet" href="assets/brtv-design.css">
<style>
  html,body{height:100%;}
  body{background:var(--paper);overflow:hidden;}
  .cw{display:grid;grid-template-columns:236px 1fr 340px;grid-template-rows:minmax(0,1fr);height:100vh;}
  .cw-left,.cw-center,.cw-right{min-height:0;}   /* 关键：让各栏内部 overflow 能滚动，而非撑破容器 */

  /* —— 左栏：项目 / 会话 —— */
  .cw-left{background:linear-gradient(180deg,#fff,#fbf6f1);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;}
  .cw-brand{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .cw-brand .id{display:flex;flex-direction:column;line-height:1.2;}
  .cw-brand .id b{font-family:var(--serif);font-size:14px;}
  .cw-brand .id small{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;}
  .sec-lbl{font-size:11px;color:var(--ink-3);letter-spacing:.12em;padding:14px 16px 6px;font-weight:700;}
  .new-conv{margin:10px 14px 4px;}
  .proj-item{display:flex;gap:9px;align-items:flex-start;padding:9px 14px;cursor:pointer;position:relative;transition:.15s;}
  .proj-item:hover{background:rgba(140,43,34,.05);}
  .proj-item.on{background:linear-gradient(90deg,rgba(209,26,42,.1),transparent);}
  .proj-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--red);}
  .proj-item .ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:15px;background:var(--red-soft);}
  .proj-item .tx{min-width:0;}
  .proj-item .tx b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proj-item .tx span{font-size:11px;color:var(--ink-3);}
  .cw-team{padding:4px 8px 12px;overflow-y:auto;flex:1;min-height:0;}
  .team-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;}
  .team-row .tx{line-height:1.25;min-width:0;}
  .team-row .tx b{font-size:12px;display:block;}
  .team-row .tx span{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}

  /* —— 中栏：对话 —— */
  .cw-center{display:flex;flex-direction:column;min-width:0;background:var(--paper);}
  .ctx-bar{display:flex;align-items:center;gap:12px;padding:11px 22px;background:var(--glass);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex:none;z-index:5;}
  .ctx-bar .ttl{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
  .ctx-bar .stack{display:flex;}
  .ctx-bar .stack .avatar{margin-left:-8px;box-shadow:0 0 0 2px #fff;}
  .conv{flex:1;min-height:0;overflow-y:auto;padding:22px 22px 8px;display:flex;flex-direction:column;gap:18px;}
  .conv-inner{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;}

  .m{display:flex;gap:11px;align-items:flex-start;animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both;}
  .m.me{flex-direction:row-reverse;}
  .m .body{min-width:0;max-width:88%;display:flex;flex-direction:column;gap:8px;}
  .m.me .body{align-items:flex-end;}
  .m .name{font-size:11.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:7px;}
  .m .txt{background:#fff;border-radius:4px 14px 14px 14px;padding:11px 15px;box-shadow:var(--sh-1);font-size:14px;line-height:1.6;}
  .m.me .txt{background:linear-gradient(135deg,var(--red),var(--red-wall));color:#fff;border-radius:14px 4px 14px 14px;}

  /* 意图识别 chip */
  .intent{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
    background:linear-gradient(120deg,rgba(209,26,42,.1),rgba(200,168,106,.16));
    color:var(--red-wall);border-radius:99px;padding:5px 13px;font-size:12px;font-weight:600;
    animation:popIn .4s cubic-bezier(.2,.8,.2,1) both;}
  .intent .rt{opacity:.55;}
  .intent .who{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.65);border-radius:99px;padding:1px 8px 1px 3px;}

  .out-card{width:100%;max-width:560px;}

  /* —— 输入区 —— */
  .composer{flex:none;border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);padding:10px 22px 14px;}
  .composer-inner{max-width:760px;margin:0 auto;}
  .intents-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:9px;}
  .qi{flex:none;display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--red-wall);
    border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:var(--sh-1);
    transition:.15s;white-space:nowrap;}
  .qi:hover{background:var(--red);color:#fff;transform:translateY(-1px);}
  .qi.next{background:linear-gradient(135deg,var(--red-bright),var(--red-wall));color:#fff;box-shadow:var(--sh-red);}
  .qi.next .ico{font-size:11px;}
  .input-box{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 8px 8px 16px;box-shadow:var(--sh-1);}
  .input-box .ph{flex:1;color:var(--ink-3);font-size:13.5px;}
  .input-box .tools{display:flex;align-items:center;gap:4px;color:var(--ink-3);}

  /* —— 右栏：任务面板 —— */
  .cw-right{background:linear-gradient(180deg,#fff,#fbf6f1);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;}
  .rp-head{padding:16px 18px 8px;}
  .rp-head .k{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:700;}
  .rp-head .v{font-family:var(--serif);font-size:17px;font-weight:700;margin-top:2px;}
  .rp-sec{padding:12px 18px;border-top:1px solid var(--line);}
  .rp-sec .h{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .prog{display:flex;flex-direction:column;gap:0;}
  .prog-step{display:flex;align-items:center;gap:10px;padding:5px 0;position:relative;}
  .prog-step .pdot{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#fff;background:#cfc6bf;transition:.3s;z-index:2;}
  .prog-step.done .pdot{background:linear-gradient(135deg,var(--ok),#1f7d52);}
  .prog-step.active .pdot{background:linear-gradient(135deg,var(--red-bright),var(--red-wall));animation:nodePulse 1.8s infinite;}
  .prog-step:not(:last-child)::before{content:"";position:absolute;left:9px;top:22px;height:14px;width:2px;background:var(--line-2);z-index:1;}
  .prog-step.done:not(:last-child)::before{background:var(--ok);}
  .prog-step .pl{font-size:12.5px;color:var(--ink);}
  .prog-step.pending .pl{color:var(--ink-3);}
  .arti-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#fff;box-shadow:var(--sh-1);
    margin-bottom:8px;cursor:pointer;transition:.15s;animation:slideInR .4s cubic-bezier(.2,.7,.2,1) both;}
  .arti-item:hover{box-shadow:var(--sh-2);transform:translateX(2px);}
  .arti-item .ai{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
  .arti-item .tx{min-width:0;flex:1;}
  .arti-item .tx b{font-size:12.5px;display:block;}
  .arti-item .tx span{font-size:11px;color:var(--ink-3);}
  .empty-arti{font-size:12px;color:var(--ink-3);text-align:center;padding:18px 8px;line-height:1.6;}
  .qbar{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .qbar .ql{width:62px;font-size:11.5px;color:var(--ink-2);flex:none;}
  .qbar .qt{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;}
  .qbar .qf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--gold));}
  .qbar .qv{font-size:11px;font-weight:700;color:var(--red-wall);width:30px;text-align:right;}

  /* —— 视频裁剪剪辑器（对话内）—— */
  .trim-track{position:relative;height:48px;border-radius:8px;background:#1a1310;display:flex;gap:2px;padding:4px;user-select:none;}
  .trim-track .sh{flex:1;border-radius:4px;}
  .trim-mask{position:absolute;top:4px;bottom:4px;background:rgba(16,10,9,.66);z-index:2;pointer-events:none;border-radius:4px;}
  .trim-sel{position:absolute;top:0;bottom:0;border:2px solid var(--red);border-radius:8px;z-index:3;pointer-events:none;
    box-shadow:0 0 0 3px rgba(200,19,42,.16);}
  .trim-h{position:absolute;top:0;bottom:0;width:16px;z-index:4;cursor:ew-resize;display:flex;align-items:center;justify-content:center;}
  .trim-h::before{content:"";position:absolute;top:0;bottom:0;width:7px;background:var(--red);border-radius:4px;transition:background .15s;}
  .trim-h::after{content:"";position:relative;width:2px;height:18px;background:#fff;border-radius:2px;}
  .trim-h:hover::before,.trim-h:active::before{background:var(--red-bright);}
  .trim-tc{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:8px;font-variant-numeric:tabular-nums;}
  .trim-tc b{color:var(--red-wall);font-family:var(--mono);}

  /* —— AIGC 题图卡 —— */
  .gen-img{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/10;box-shadow:var(--sh-1);}
  .gen-img .ai-badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.42);color:#fff;font-size:10px;
    padding:2px 9px;border-radius:99px;backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:5px;}
  .gen-img .lbl{position:absolute;left:11px;bottom:10px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 5px rgba(0,0,0,.55);}
  .gen-img.skeleton-art{background:linear-gradient(90deg,#e9ddd0,#f6efe5,#e9ddd0);background-size:600px 100%;animation:shimmer 1.2s linear infinite;}

  /* —— 选题角度卡 —— */
  .angle-opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:var(--paper-2);
    cursor:pointer;transition:.15s;margin-bottom:7px;}
  .angle-opt:hover{background:var(--red-soft);transform:translateX(2px);}
  .angle-opt.sel{background:var(--red-soft);box-shadow:inset 0 0 0 1.5px var(--red);}
  .angle-opt .no{width:22px;height:22px;border-radius:6px;background:#fff;color:var(--red-wall);font-weight:700;
    font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;}

  /* —— 多语种卡 —— */
  .lang-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--paper-2);margin-bottom:7px;}
  .lang-flag{width:32px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:11px;font-weight:700;flex:none;font-family:var(--mono);}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/vendor/react.production.min.js"></script>
<script src="assets/vendor/react-dom.production.min.js"></script>
<script src="assets/vendor/babel.min.js"></script>
<script src="assets/brtv-data.js"></script>
<script src="assets/brtv-icons.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const B = window.BRTV;
const S = B.story;
const Icon = ({ n, cls }) => <span className={'ico ' + (cls || '')} dangerouslySetInnerHTML={{ __html: brtvIcon(n) }} />;

/* ===== 头像 ===== */
function Av({ id, size }) {
  const e = B.emp(id) || { color: '#8C2B22', short: 'AI', status: 'on' };
  return (
    <span className={'avatar' + (size ? ' ' + size : '')} style={{ background: e.color }}>
      {e.short}<i className={'dot ' + (e.status === 'busy' ? 'busy' : 'on')} />
    </span>
  );
}

/* ===== 输出卡片（对话内可编辑产物） ===== */
function DraftCard({ data }) {
  const d = data || {};
  const titleTx = d.title || '快讯稿 · AI 初稿 38 秒';
  const eh = d.editHtml || { base: '<span class="ai-mark">' + S.draftFlash.slice(0, 24) + '</span>' + S.draftFlash.slice(24),
    polish: '<span class="ai-mark">北京今晨升级发布寒潮橙色预警。</span>受强冷空气影响，气温较昨日同期骤降 12℃，预计明晨平原地区最低降至 -9℃。市交通、城管、供热等部门<span class="ai-mark">连夜启动应急响应</span>，主干道除雪保畅、供暖保障同步推进。<span class="ai-mark">提醒市民防寒保暖、错峰出行。</span>',
    rewrite: '<span class="ai-mark">除雪车彻夜奔忙，暖气管网满负荷运转——</span>面对入冬以来最强寒潮，北京今晨升级发布橙色预警，多部门连夜联动，一场保畅通、保供暖的城市应急行动就此展开。' };
  const expand = d.expand || '<p style="margin:.6em 0 0">截至发稿，全市已出动除雪人员 1.2 万人次、作业车辆 2300 余台，重点路段通行正常；12345 热线增设防寒咨询专席。</p>';
  const adopt = d.adopt || '采用 · 进粗剪';
  const [html, setHtml] = useState(eh.base);
  const [ver, setVer] = useState(0);
  const [working, setWorking] = useState(null);
  function aiEdit(kind) {
    if (working) return;
    setWorking(kind);
    setTimeout(() => {
      if (kind === '润色' && eh.polish) setHtml(eh.polish);
      else if (kind === '改写' && eh.rewrite) setHtml(eh.rewrite);
      else if (kind === '扩写') setHtml(h => h + expand);
      setVer(v => v + 1);
      setWorking(null);
    }, 750);
  }
  return (
    <div className="card-msg out-card anim-pop">
      <div className="top" style={{ background: 'linear-gradient(135deg,var(--red),var(--red-wall))' }}>
        <Icon n="edit" /> {titleTx}
        <span className="grow" /><span className="pill" style={{ background: 'rgba(255,255,255,.2)', color: '#fff' }}>可编辑</span>
      </div>
      <div className="body">
        <div className="edit-toolbar" style={{ marginBottom: 8 }}>
          {['B', 'H', '“”'].map((b, i) => <span key={i} className="b">{b}</span>)}
          <span className="b"><Icon n="refresh" /></span>
          <span className="grow" />
          <span className="faint" style={{ fontSize: 11 }}>点正文可直接改字</span>
        </div>
        <div className="editable" key={ver} contentEditable suppressContentEditableWarning
          dangerouslySetInnerHTML={{ __html: html }} />
        <div className="row gap-8 wrap" style={{ marginTop: 10 }}>
          {['润色', '改写', '扩写'].map(k => (
            <button key={k} className="btn btn-sm" onClick={() => aiEdit(k)} disabled={!!working}>
              {working === k
                ? <span className="ai-working"><span className="spin" />{k}中</span>
                : <><Icon n={k === '扩写' ? 'expand' : 'sparkle'} /> AI {k}</>}
            </button>
          ))}
          <span className="grow" />
          <button className="btn btn-primary btn-sm"><Icon n="check" /> {adopt}</button>
        </div>
      </div>
    </div>
  );
}
function VideoCard({ data }) {
  const d = data || {};
  const title0 = d.title || '竖屏版粗剪';
  const tone = d.tone || 'thumb-road';
  const meta = d.meta || '9:16 · 大字幕 · 6 个分镜';
  const note = d.note || '配《北京时间》片头，卡点节奏已对齐口播。';
  const BASE = d.baseSec || 45;                       // 原片秒数
  const pad = n => String(Math.round(n)).padStart(2, '0');
  const fmt = s => pad(Math.floor(s / 60)) + ':' + pad(Math.round(s % 60));
  const [play, setPlay] = useState(false);
  const [crop, setCrop] = useState(false);
  const [range, setRange] = useState({ in: 8, out: 80 });
  const [dur, setDur] = useState(fmt(BASE));
  const [saved, setSaved] = useState(false);
  const [smooth, setSmooth] = useState(false);
  const [smartHint, setSmartHint] = useState(false);
  const trackRef = useRef(null);
  const tc = pct => fmt(BASE * pct / 100);
  const selSec = BASE * (range.out - range.in) / 100;
  const tr = smooth ? 'left .42s cubic-bezier(.4,1.3,.4,1), width .42s cubic-bezier(.4,1.3,.4,1)' : 'none';

  function startDrag(which, e) {
    e.preventDefault();
    setSmooth(false);
    const move = ev => {
      const r = trackRef.current.getBoundingClientRect();
      let p = ((ev.clientX - r.left) / r.width) * 100;
      p = Math.max(0, Math.min(100, p));
      setRange(prev => which === 'in'
        ? { ...prev, in: Math.min(p, prev.out - 8) }
        : { ...prev, out: Math.max(p, prev.in + 8) });
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }
  function smartTrim() {                              // AI 一键快速剪辑：剔除冗余镜头
    setSmooth(true); setSmartHint(true);
    setRange({ in: 14, out: 64 });
    setTimeout(() => setSmooth(false), 460);
  }
  function apply() { setDur(fmt(selSec)); setCrop(false); setSaved(true); }

  return (
    <div className="card-msg out-card anim-pop" style={{ maxWidth: crop ? 440 : 360 }}>
      <div className="top" style={{ background: 'linear-gradient(135deg,#C8102E,var(--red))' }}>
        <Icon n="film" /> {title0} {dur}
        <span className="grow" />
        {crop
          ? <span className="pill" style={{ background: 'rgba(255,255,255,.2)', color: '#fff' }}>剪辑中</span>
          : saved && <span className="pill" style={{ background: 'rgba(255,255,255,.2)', color: '#fff' }}><Icon n="check" cls="ico-xs" /> 已裁剪</span>}
      </div>
      <div className="body">
        {!crop ? (
          <div className="row gap-12 items-start">
            <div className="player tall" style={{ width: 132, flex: 'none' }}>
              <div className={'stage ' + tone} onClick={() => setPlay(p => !p)} style={{ cursor: 'pointer' }}>
                <div className="scanline" />
                <div className="thumb-ico"><Icon n={play ? 'pause' : 'play'} cls="ico-2xl" /></div>
                <span className="dur" style={{ position: 'absolute', right: 6, bottom: 6 }}>{dur}</span>
              </div>
            </div>
            <div className="col gap-8 grow">
              <div className="faint" style={{ fontSize: 12 }}>{meta}</div>
              <div style={{ fontSize: 12.5 }}>{note}</div>
              <div className="timeline" style={{ padding: 5, cursor: 'pointer' }} onClick={() => setCrop(true)}>
                {S.shots.slice(0, 6).map((s, i) => <div key={i} className={'shot ' + s.tone} style={{ width: 34, height: 26 }} />)}
              </div>
              <div className="row gap-8">
                <button className="btn btn-sm" onClick={() => setCrop(true)}><Icon n="scissors" /> 快速剪辑</button>
                <button className="btn btn-primary btn-sm">送审</button>
              </div>
            </div>
          </div>
        ) : (
          <div className="anim-in">
            <div className="row gap-12 items-start" style={{ marginBottom: 12 }}>
              <div className="player tall" style={{ width: 92, flex: 'none' }}>
                <div className={'stage ' + tone}><div className="scanline" /><div className="thumb-ico"><Icon n="play" cls="ico-xl" /></div></div>
              </div>
              <div className="col gap-6 grow">
                <b style={{ fontSize: 13 }}>快速剪辑 · 拖两端裁掉头尾</b>
                <span className="faint" style={{ fontSize: 11.5, lineHeight: 1.5 }}>原片 {fmt(BASE)} · 拖红色手柄设入点 / 出点，或点「智能去冗」一键剔除冗余镜头。</span>
                {smartHint && <span className="tag tag-ai" style={{ alignSelf: 'flex-start' }}><Icon n="sparkle" cls="ico-xs" /> AI 已优化选段</span>}
              </div>
            </div>
            <div className="trim-track" ref={trackRef}>
              {S.shots.slice(0, 6).map((s, i) => <div key={i} className={'sh ' + s.tone} />)}
              <div className="trim-mask" style={{ left: 0, width: range.in + '%', transition: tr }} />
              <div className="trim-mask" style={{ left: range.out + '%', right: 0, transition: tr }} />
              <div className="trim-sel" style={{ left: range.in + '%', width: (range.out - range.in) + '%', transition: tr }} />
              <div className="trim-h" style={{ left: range.in + '%', transform: 'translateX(-50%)', transition: tr }} onMouseDown={e => startDrag('in', e)} />
              <div className="trim-h" style={{ left: range.out + '%', transform: 'translateX(-50%)', transition: tr }} onMouseDown={e => startDrag('out', e)} />
            </div>
            <div className="trim-tc">
              <span>入点 <b>{tc(range.in)}</b></span>
              <span>选段 <b>{fmt(selSec)}</b></span>
              <span>出点 <b>{tc(range.out)}</b></span>
            </div>
            <div className="row gap-8" style={{ marginTop: 12 }}>

  {
    id: 'ciftis', icon: 'operate', name: '服贸会筹备', sub: '深度策划 · 草拟', softBg: 'rgba(59,114,196,.1)',
    tag: { label: '经济', bg: 'rgba(59,114,196,.12)', color: 'var(--info)' },
    scenario: '深度策划', priority: 'P1 选题策划', startedAt: '今天 10:05',
    welcome: { emp: 'daoyan', text: '服贸会还在筹备期，目前在做选题储备。可让我先拉一版报道策划框架，或采集相关素材。也可切到「寒潮应急 / 中轴线申遗周年」体验完整对话流程。' },
    collab: ['daoyan', 'topic', 'writer'],
    pipeline: [{ id: 'judge', label: '选题研判' }, { id: 'plan', label: '策划框架' }, { id: 'ingest', label: '素材采集' }, { id: 'create', label: '撰稿成片' }],
    quality: [{ k: '框架完整', v: 86 }, { k: '数据支撑', v: 78 }, { k: '时效把握', v: 90 }],
    script: [
      { user: '给个服贸会报道策划框架', emp: 'writer', intent: '选题策划 · 框架',
        reply: '已生成报道策划框架：含「主题主线 / 重点板块 / 产品矩阵 / 时间节点」四部分，点正文可直接编辑，或用 AI 润色 / 扩写。',
        card: 'draft', data: { title: '服贸会报道策划框架', adopt: '采用 · 进采集', editHtml: { base: ciftisBase, polish: ciftisPolish }, expand: ciftisExpand },
        pipe: ['judge', 'plan'], arti: { k: '策划框架', emp: 'writer', ic: 'edit' } },
      { user: '把相关素材也拉进来', emp: 'tagger', intent: '素材采集 · 打标',
        reply: '已采集服贸会往届及筹备相关素材 18 条并自动打标，可检索调用。', card: null,
        pipe: ['ingest'], arti: { k: '素材包 · 18 条', emp: 'tagger', ic: 'upload' } },
    ],
  },
  {
    id: 'rush', icon: 'subway', name: '早高峰交通', sub: '已分发 · 复盘中', softBg: 'rgba(46,158,107,.1)',
    tag: { label: '民生', bg: 'rgba(46,158,107,.12)', color: 'var(--ok)' },
    scenario: '传播反馈', priority: 'P1 传播反馈', startedAt: '今天 07:30',
    welcome: { emp: 'data', text: '「早高峰交通提示」这条已分发，正在做传播复盘。要看这条的传播数据，还是生成一份复盘简报？' },
    collab: ['data', 'pub', 'topic'],
    pipeline: [{ id: 'collect', label: '数据采集' }, { id: 'analyze', label: '自动分析' }, { id: 'board', label: '效能看板' }, { id: 'brief', label: '简报生成' }],
    quality: [{ k: '数据完整', v: 97 }, { k: '归因合理', v: 88 }, { k: '结论可用', v: 90 }],
    script: [
      { user: '看这条早高峰的传播复盘', emp: 'data', intent: '传播反馈 · 复盘',
        reply: '这条全网播放 386 万，抖音占比 62%，峰值出现在 7:40–8:10；评论高频词为「限流」「绕行」「准点」，整体口碑正向。', card: null,
        pipe: ['collect', 'analyze'], arti: { k: '传播数据', emp: 'data', ic: 'feedback' } },
      { user: '生成一份复盘简报', emp: 'data', intent: '简报生成',
        reply: '复盘简报已生成，含「传播概览 / 平台分布 / 用户反馈 / 优化建议」，点正文可编辑，或用 AI 润色 / 扩写后发部门。',
        card: 'draft', data: { title: '早高峰交通 · 传播复盘简报', adopt: '采用 · 发部门', editHtml: { base: rushBase, polish: rushPolish }, expand: rushExpand },
        pipe: ['board', 'brief'], arti: { k: '复盘简报', emp: 'data', ic: 'edit' } },
    ],
  },
];
const projById = id => PROJECTS.find(p => p.id === id);

/* ===== 主应用 ===== */
function App() {
  const [activeProj, setActiveProj] = useState('coldwave');
  const P = projById(activeProj);
  const [msgs, setMsgs] = useState([{ role: 'ai', emp: P.welcome.emp, text: P.welcome.text }]);
  const [step, setStep] = useState(0);
  const [done, setDone] = useState([]);          // 已完成流水线节点
  const [artis, setArtis] = useState([]);        // 产物
  const [busy, setBusy] = useState(false);
  const convRef = useRef(null);

  // 等卡片布局稳定后再滚到底（双 rAF，避免卡片渲染后高度再增长导致滚不到最新消息）
  useEffect(() => {
    const el = convRef.current;
    if (!el) return;
    let r2;
    const r1 = requestAnimationFrame(() => { r2 = requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; }); });
    return () => { cancelAnimationFrame(r1); if (r2) cancelAnimationFrame(r2); };
  }, [msgs]);

  function selectProject(p) {                       // 切换项目 = 切换一段对话
    if (p.id === activeProj) return;
    setActiveProj(p.id);
    setMsgs([{ role: 'ai', emp: p.welcome.emp, text: p.welcome.text }]);
    setStep(0); setDone([]); setArtis([]); setBusy(false);
  }

  function advance() {
    if (busy || step >= P.script.length) return;
    const s = P.script[step];
    setBusy(true);
    setMsgs(m => [...m, { role: 'me', text: s.user }]);
    setMsgs(m => [...m, { role: 'ai', emp: s.emp, typing: true }]);
    setTimeout(() => {
      setMsgs(m => {
        const c = m.slice(0, -1);
        return [...c, { role: 'ai', emp: s.emp, intent: s.intent, text: s.reply, card: s.card, cardData: s.data }];
      });
      setDone(d => [...new Set([...d, ...(s.pipe || [])])]);
      if (s.arti) setArtis(a => [...a, s.arti]);
      setStep(step + 1);
      setBusy(false);
    }, 900);
  }

  const quality = P.quality;

  return (
    <div className="cw">
      {/* 左栏 */}
      <aside className="cw-left">
        <div className="cw-brand">
          <span className="brtv-mark">BRTV</span>
          <div className="id"><b>智能对话工作台</b><small>AI COWORK</small></div>
        </div>
        <div className="new-conv"><button className="btn btn-primary btn-block btn-sm"><Icon n="plus" /> 新建对话</button></div>
        <div className="sec-lbl">项目 / 会话</div>
        {PROJECTS.map(p => (
          <div key={p.id} className={'proj-item' + (p.id === activeProj ? ' on' : '')} onClick={() => selectProject(p)}>
            <div className="ic" style={{ background: p.softBg || 'var(--red-soft)' }}><Icon n={p.icon} cls="ico-lg" /></div>
            <div className="tx"><b>{p.name}</b><span>{p.sub}</span></div>
          </div>
        ))}
        <div className="sec-lbl">协作团队 · 9 在线</div>
        <div className="cw-team">
          {B.employees.map(e => (
            <div key={e.id} className="team-row">
              <Av id={e.id} size="sm" />
              <div className="tx"><b>{e.name}</b><span>{e.role}</span></div>
            </div>
          ))}
        </div>
      </aside>

      {/* 中栏 */}
      <main className="cw-center">
        <div className="ctx-bar">
          <span className="ic" style={{ fontSize: 18 }}><Icon n={P.icon} cls="ico-lg" /></span>
          <div className="ttl">{P.name} <span className="pill" style={{ background: P.tag.bg, color: P.tag.color }}>{P.tag.label}</span> <span className="tag tag-ai">{P.scenario}</span></div>
          <span className="grow" />
          <span className="faint" style={{ fontSize: 12 }}>协作</span>
          <div className="stack">{P.collab.map(id => <Av key={id} id={id} size="sm" />)}</div>
        </div>

        <div className="conv" ref={convRef}>
          <div className="conv-inner">
            {msgs.map((m, i) => <Message key={i} m={m} />)}
          </div>
        </div>

        <div className="composer">
          <div className="composer-inner">
            <div className="intents-row">
              {step < P.script.length
                ? <span className="qi next" onClick={advance}><Icon n="play" />{P.script[step].user}</span>
                : <span className="qi" style={{ pointerEvents: 'none', opacity: .6 }}><Icon n="check" /> 本条已走完全流程</span>}
              {['查素材', '@守正 审一下', '看传播数据', '换题图'].map((q, i) => (
                <span key={i} className="qi" onClick={advance}>{q}</span>
              ))}
            </div>
            <div className="input-box">
              <span className="tools" style={{ fontSize: 18 }}><Icon n="plus" /></span>
              <span className="ph">和 AI 员工对话，或 @ 指定数字员工下指令…{busy ? ' （执行中）' : ''}</span>
              <span className="tools" style={{ fontSize: 16 }}><Icon n="mic" /></span>
              <button className="btn btn-primary btn-icon" onClick={advance} disabled={busy}><Icon n="sendarrow" /></button>
            </div>
          </div>
        </div>
      </main>

      {/* 右栏 */}
      <aside className="cw-right">
        <div className="rp-head">
          <div className="k">当前项目</div>
          <div className="v">{P.name}</div>
          <div className="row gap-8" style={{ marginTop: 6 }}>
            <span className="pill" style={{ background: 'rgba(140,43,34,.1)', color: 'var(--red-wall)' }}>{P.priority}</span>
            <span className="faint" style={{ fontSize: 11.5 }}>开始 {P.startedAt}</span>
          </div>
        </div>

        <div className="rp-sec">
          <div className="h">{P.scenario}流水线 <span className="faint" style={{ fontWeight: 400 }}>{done.length}/{P.pipeline.length}</span></div>
          <div className="prog">
            {P.pipeline.map(p => {
              const st = done.includes(p.id) ? 'done' : (done.length && P.pipeline.find(x => !done.includes(x.id))?.id === p.id ? 'active' : 'pending');
              return (
                <div key={p.id} className={'prog-step ' + st}>
                  <span className="pdot">{st === 'done' ? <Icon n="check" /> : ''}</span>
                  <span className="pl">{p.label}</span>
                </div>
              );
            })}
          </div>
        </div>

        <div className="rp-sec">
          <div className="h">产物 <span className="faint" style={{ fontWeight: 400 }}>{artis.length} 项</span></div>
          {artis.length === 0
            ? <div className="empty-arti">还没有产物。<br />下达指令后，AI 产出的稿件 / 视频 / 多版本会汇集到这里。</div>
            : artis.map((a, i) => (
              <div key={i} className="arti-item">
                <span className="ai" style={{ background: (B.emp(a.emp) || {}).color || 'var(--red)' }}><Icon n={a.ic} /></span>
                <div className="tx"><b>{a.k}</b><span>{(B.emp(a.emp) || {}).name} · 可编辑</span></div>
                <span className="faint" style={{ fontSize: 11 }}><Icon n="sendarrow" /></span>
              </div>
            ))}
        </div>

        <div className="rp-sec">
          <div className="h">质量自检</div>
          {quality.map((q, i) => (
            <div key={i} className="qbar">
              <span className="ql">{q.k}</span>
              <span className="qt"><span className="qf" style={{ width: q.v + '%' }} /></span>
              <span className="qv">{q.v}</span>
            </div>
          ))}
        </div>
      </aside>
    </div>
  );
}

function Message({ m }) {
  if (m.role === 'me') {
    return (
      <div className="m me">
        <span className="avatar sm" style={{ background: 'linear-gradient(135deg,#5C534F,#221C1A)' }}>我</span>
        <div className="body"><div className="txt">{m.text}</div></div>
      </div>
    );
  }
  const e = B.emp(m.emp) || {};
  const Card = m.card ? CARDS[m.card] : null;
  return (
    <div className="m">
      <Av id={m.emp} size="sm" />
      <div className="body">
        <div className="name">{e.name} <span className="faint" style={{ fontWeight: 400 }}>· {e.role}</span></div>
        {m.intent && <span className="intent">意图识别 <span className="rt"><Icon n="sendarrow" /></span> {m.intent} <span className="who"><Av id={m.emp} size="sm" />{e.name}</span></span>}
        {m.typing
          ? <div className="txt"><span className="dots-typing"><i /><i /><i /></span></div>
          : <div className="txt">{m.text}</div>}
        {Card && <Card data={m.cardData} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
