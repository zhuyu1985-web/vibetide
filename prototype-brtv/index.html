<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRTV · 智能交互工作台 — 三端原型</title>
<link rel="stylesheet" href="assets/brtv-design.css">
<style>
  html,body{height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(1100px 620px at 14% -12%, rgba(209,26,42,.12), transparent 60%),
      radial-gradient(900px 560px at 92% 0%, rgba(200,168,106,.16), transparent 58%),
      linear-gradient(160deg, #fdf7f3, #f7ece4 58%, #f2e6dd);
    color:var(--ink);display:flex;flex-direction:column;
  }
  /* —— 顶栏 —— */
  .top{display:flex;align-items:center;gap:20px;padding:16px 28px;flex:none;}
  .top .title{display:flex;flex-direction:column;line-height:1.25;}
  .top .title b{font-family:var(--serif);font-size:18px;letter-spacing:.02em;}
  .top .title span{font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;}
  .top .mono-id{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);
    display:flex;align-items:center;gap:14px;}
  .live-dot{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);}
  .live-dot i{width:7px;height:7px;border-radius:50%;background:#36d07a;box-shadow:0 0 8px #36d07a;animation:blink 1.6s infinite;}

  /* —— 三端切换器 —— */
  .switch-wrap{display:flex;justify-content:center;padding:4px 0 14px;flex:none;}
  .switch{position:relative;display:flex;gap:4px;padding:5px;border-radius:16px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border:1px solid var(--line);
    box-shadow:0 6px 22px rgba(94,26,24,.08);}
  .switch .pill{position:absolute;top:5px;bottom:5px;border-radius:12px;
    background:linear-gradient(135deg,var(--red-bright),var(--red-wall));box-shadow:var(--sh-red);
    transition:left .42s cubic-bezier(.5,1.4,.4,1), width .42s cubic-bezier(.5,1.4,.4,1);z-index:0;}
  .seg{position:relative;z-index:1;display:flex;align-items:center;gap:9px;padding:11px 22px;border-radius:12px;
    cursor:pointer;border:0;background:transparent;color:var(--ink-2);transition:color .3s;}
  .seg.on{color:#fff;}
  .seg .ico{font-size:18px;}
  .seg .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;}
  .seg .tx b{font-size:14px;}
  .seg .tx small{font-size:10.5px;opacity:.7;}

  /* —— 舞台 —— */
  .stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 18px 22px;}
  .frame-host{position:absolute;inset:0 18px 22px;display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.985);transition:opacity .45s ease, transform .45s ease;pointer-events:none;}
  .frame-host.show{opacity:1;transform:scale(1);pointer-events:auto;}
  iframe{border:0;background:#fff;width:100%;height:100%;border-radius:14px;
    box-shadow:0 14px 50px rgba(94,26,24,.13), 0 2px 10px rgba(94,26,24,.06);}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink-3);font-size:13px;gap:10px;}
  .loading .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(140,43,34,.2);
    border-top-color:var(--red);animation:spinSlow .7s linear infinite;}
  .caption{position:absolute;left:28px;bottom:26px;font-size:11.5px;color:var(--ink-3);max-width:340px;line-height:1.5;}
</style>
</head>
<body>
  <header class="top">
    <span class="brtv-mark lg">BRTV</span>
    <div class="title">
      <b>智能交互工作台</b>
      <span>北京广播电视台 · 融媒体智能生产门户</span>
    </div>
    <div class="mono-id">
      <span class="live-dot"><i></i>9 位 AI 数字员工在线</span>
      <span>值班 · 周屿</span>
      <span id="clock">--:--</span>
    </div>
  </header>

  <div class="switch-wrap">
    <div class="switch" id="switch">
      <div class="pill" id="pill"></div>
      <button class="seg on" data-src="cowork.html">
        <span class="ico" data-ic="cowork"></span><span class="tx"><b>对话工作台</b><small>AI 对话式生产</small></span>
      </button>
      <button class="seg" data-src="pc.html">
        <span class="ico" data-ic="pipeline"></span><span class="tx"><b>PC 生产台</b><small>智能生产流水线</small></span>
      </button>
      <button class="seg" data-src="app.html">
        <span class="ico" data-ic="app"></span><span class="tx"><b>手机 APP</b><small>记者外勤生产</small></span>
      </button>
      <button class="seg" data-src="im.html">
        <span class="ico" data-ic="imchat"></span><span class="tx"><b>移动 IM</b><small>飞书 / 企微 / 钉钉</small></span>
      </button>
    </div>
  </div>

  <main class="stage">
    <div class="loading" id="loading"><span class="spin"></span>正在加载工作台…</div>
    <div class="frame-host show" id="host"><iframe id="frame" src="cowork.html" title="BRTV 工作台"></iframe></div>
    <div class="caption">演示场景：<b style="color:var(--red-wall)">北京迎入冬来最强寒潮 · 多部门启动应急响应</b> — 一条选题从热点研判到多平台分发的完整智能生产闭环。</div>
  </main>

<script src="assets/brtv-icons.js"></script>
<script>
  // 注入切换器图标（SVG 替代 emoji）
  document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = window.brtvIcon(el.dataset.ic); });

  // 时钟
  function tick(){const d=new Date();document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  tick();setInterval(tick,15000);

  const segs=[...document.querySelectorAll('.seg')];
  const pill=document.getElementById('pill');
  const frame=document.getElementById('frame');
  const host=document.getElementById('host');
  const loading=document.getElementById('loading');

  function movePill(el){pill.style.left=el.offsetLeft+'px';pill.style.width=el.offsetWidth+'px';}
  function activate(el){
    segs.forEach(s=>s.classList.toggle('on',s===el));
    movePill(el);
    // 跨端淡出 → 切 src → 淡入
    host.classList.remove('show');
    loading.style.opacity='1';
    setTimeout(()=>{
      frame.src=el.dataset.src;
    },200);
  }
  frame.addEventListener('load',()=>{loading.style.opacity='0';host.classList.add('show');});
  segs.forEach(el=>el.addEventListener('click',()=>{if(!el.classList.contains('on'))activate(el);}));
  window.addEventListener('load',()=>movePill(segs[0]));
  window.addEventListener('resize',()=>movePill(document.querySelector('.seg.on')));
</script>
</body>
</html>
